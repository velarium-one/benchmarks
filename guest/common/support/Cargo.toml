[package]
name = "guest-kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv-fixture-allocator = { path = "../allocator" }
riscv-fixture-kernel = { path = "../kernel" }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
