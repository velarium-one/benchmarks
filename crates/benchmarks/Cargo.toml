[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["engine"]
engine = ["dep:client"]

[dependencies]
client = { path = "../client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["checked-decode", "safe-decode"] }
riscv-fixture-wasm-parser = { path = "../../guest/wasm-parser" }

[dev-dependencies]
rstest = "0.26"

[[bin]]
name = "demo"
path = "src/main.rs"
required-features = ["engine"]

[[bench]]
name = "demo"
path = "benches/demo.rs"
harness = false
required-features = ["engine"]
