[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["engine"]
engine = ["dep:client"]

[dependencies]
client = { path = "../client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
guest-kit = { path = "../../guest/common/support" }

[dev-dependencies]
rstest = "0.26"

[build-dependencies]
glob = "0.3"

[[bin]]
name = "bench"
path = "src/main.rs"
required-features = ["engine"]
